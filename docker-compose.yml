services:
  mongodb:
    image: mongo:7
    container_name: lead-finder-mongodb
    restart: unless-stopped
    ports:
      - "27011:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lead-finder-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8001:8001"
    extra_hosts:
    - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    container_name: lead-finder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongodb_data:
