services:
  mongodb:
    image: mongo:7
    container_name: lead-finder-mongodb
    restart: unless-stopped
    ports:
      - "27011:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lead-finder-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      TZ: Asia/Kolkata
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.45}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-512}
    volumes:
      # Persist daily YYYY-MM-DDlogs.txt + app.log on the VPS host (max 7 daily files).
      - ./backend/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8001:8001"
    extra_hosts:
    - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    container_name: lead-finder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  ollama:
    image: ollama/ollama:latest
    container_name: lead-finder-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongodb_data:
  ollama_data: